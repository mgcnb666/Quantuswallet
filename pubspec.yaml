name: quantus_lite_wallet
description: A minimal, security-focused Quantus mainnet wallet.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  quantus_sdk:
    path: packages/quantus_sdk
  convert: ^3.1.2
  cryptography: ^2.9.0
  flutter_secure_storage: ^10.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # Generated Quantus bindings declare codegen 2.12.0 and reject a mismatched runtime.
  flutter_rust_bridge: 2.12.0

flutter:
  uses-material-design: true
