name: Android ARM64

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_SUPPRESS_ANALYTICS: "true"
  RUSTFLAGS: >-
    --remap-path-prefix=/home/runner=/home/builder
    --remap-path-prefix=${{ github.workspace }}=/workspace/Quantuswallet

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install verified Flutter 3.47.3
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/flutter.tar.xz"
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.3-stable.tar.xz \
            --output "$archive"
          echo "988665565cad9091db1baa54bf6d3868bb40e29719592f3c3a164deefd4208e1  $archive" \
            | sha256sum --check -
          tar -xf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install verified Android Command-line Tools
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/android-commandlinetools.zip"
          extract_dir="$RUNNER_TEMP/android-commandlinetools"
          android_sdk_root="$RUNNER_TEMP/android-sdk"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            --output "$archive"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $archive" \
            | sha256sum --check -
          mkdir -p "$extract_dir" "$android_sdk_root/cmdline-tools"
          unzip -q "$archive" -d "$extract_dir"
          mv "$extract_dir/cmdline-tools" "$android_sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$android_sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_sdk_root" >> "$GITHUB_ENV"
          echo "$android_sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          flutter config --android-sdk "$ANDROID_SDK_ROOT"
          flutter config --jdk-dir "$JAVA_HOME"

      - name: Install pinned Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.89 \
            --profile minimal \
            --component clippy \
            --component rustfmt
          rustup target add --toolchain 1.89 wasm32v1-none
          rustup toolchain install nightly-2025-12-20 \
            --profile minimal \
            --component rust-src
          rustup target add \
            --toolchain nightly-2025-12-20 \
            aarch64-linux-android

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify live mainnet metadata
        run: dart run tool/verify_mainnet_metadata.dart

      - name: Verify release tag belongs to main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Build ARM64 debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: flutter build apk --debug --target-platform android-arm64

      - name: Validate release signing secrets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Missing required GitHub Actions secret: $value" >&2
              exit 1
            fi
          done

      - name: Restore release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/quantus-release.jks"
          chmod 600 "$RUNNER_TEMP/quantus-release.jks"

      - name: Build signed ARM64 release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/quantus-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            apk="build/app/outputs/flutter-apk/app-release.apk"
            name="Quantuswallet-${GITHUB_REF_NAME}-arm64.apk"
          else
            apk="build/app/outputs/flutter-apk/app-debug.apk"
            name="Quantuswallet-${GITHUB_SHA:0:7}-arm64-debug.apk"
          fi

          zipinfo -1 "$apk" \
            | awk -F/ '
                /^lib\// && $2 != "arm64-v8a" {
                  print "Unexpected ABI: " $0
                  bad=1
                }
                END { exit bad }
              '

          zipinfo -1 "$apk" \
            | grep -q '^lib/arm64-v8a/librust_lib_quantus_wallet\.so$'

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
            verify --verbose --print-certs "$apk"

          cp "$apk" "out/$name"
          (
            cd out
            sha256sum "$name" > "$name.sha256"
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quantuswallet-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            out/* \
            --verify-tag \
            --generate-notes \
            --title "Quantus Wallet $GITHUB_REF_NAME"

      - name: Remove release key
        if: always()
        run: rm -f "$RUNNER_TEMP/quantus-release.jks"
